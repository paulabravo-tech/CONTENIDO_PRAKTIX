name: Praktix borradores

on:
  schedule:
    - cron: "0 13 * * 1,4"   # lunes y jueves, 8:00 a. m. en Bogota
  workflow_dispatch:
    inputs:
      modo:
        description: "kit (una sola vez) o semana"
        default: "semana"

permissions:
  contents: write   # para guardar historial.json

jobs:
  borradores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Ejecutar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python praktix_agente.py --${{ github.event.inputs.modo || 'semana' }}
      - name: Guardar historial
        run: |
          git config user.name "praktix-bot"
          git config user.email "praktix-bot@users.noreply.github.com"
          git add historial.json
          git diff --cached --quiet || (git commit -m "Actualiza historial" && git push)
